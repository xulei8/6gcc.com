<script>

async function connectUSB() {
  try {
    // 打开串口（浏览器会弹出选择设备框，用户选你的U盘）
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });

    // 读取数据
    const reader = port.readable.getReader();
    const { value } = await reader.read();

    // 收到 U 盘发回的序列号
    const serial = new TextDecoder().decode(value);
    alert("U盘验证成功：" + serial);

  } catch (err) {
  console.log(err)
    alert("未连接U盘或未授权");
    console.error(err);
  }
}
</script>
