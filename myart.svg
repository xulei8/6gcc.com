<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <!-- 鲜艳夜空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b0b3f"/>
      <stop offset="35%" stop-color="#3b1a6e"/>
      <stop offset="65%" stop-color="#5c2a8a"/>
      <stop offset="100%" stop-color="#7a3a9a"/>
    </linearGradient>

    <!-- 鲜艳水面渐变 -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a8ae0"/>
      <stop offset="50%" stop-color="#1a5ad0"/>
      <stop offset="100%" stop-color="#0e2a90"/>
    </linearGradient>

    <!-- 月亮光晕 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d0" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffd94a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb42a" stop-opacity="0"/>
    </radialGradient>

    <!-- 水面光反射 -->
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd94a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffd94a" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff8d0" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffd94a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffd94a" stop-opacity="0"/>
    </linearGradient>

    <!-- 鲜艳流水渐变 -->
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e8ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00e8ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#7affff" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#00e8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e8ff" stop-opacity="0"/>
    </linearGradient>

    <!-- 星芒滤镜 -->
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 发光滤镜 -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 闪烁星 -->
    <g id="star1">
      <circle cx="0" cy="0" r="1.3" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g id="star2">
      <circle cx="0" cy="0" r="1.8" fill="#ffd94a" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g id="star3">
      <circle cx="0" cy="0" r="0.9" fill="#7affff">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 萤火虫 -->
    <g id="firefly">
      <circle cx="0" cy="0" r="1.8" fill="#b4ff3a" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="1;2.8;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 花瓣 -->
    <g id="petal">
      <ellipse cx="0" cy="0" rx="3.5" ry="2.2" fill="#ff8ac0" opacity="0.8" transform="rotate(-15)"/>
    </g>
  </defs>

  <!-- ===== 鲜艳夜空背景 ===== -->
  <rect width="400" height="280" fill="url(#skyGrad)"/>

  <!-- ===== 极光 ===== -->
  <g opacity="0.2">
    <path d="M0,40 Q60,15 130,45 Q200,70 270,35 Q330,10 400,40 L400,0 L0,0 Z" fill="#7affff">
      <animate attributeName="opacity" values="0.12;0.3;0.12" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;12,-6;0,0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0,60 Q80,30 160,65 Q240,90 320,50 Q360,35 400,55 L400,0 L0,0 Z" fill="#ff6ae0">
      <animate attributeName="opacity" values="0.1;0.24;0.1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-10,-5;0,0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== 星空 ===== -->
  <g filter="url(#starGlow)">
    <use href="#star2" x="60" y="25"/>
    <use href="#star2" x="180" y="40"/>
    <use href="#star2" x="290" y="20"/>
    <use href="#star2" x="110" y="60"/>
    <use href="#star2" x="250" y="55"/>
  </g>
  <use href="#star1" x="30" y="45"/>
  <use href="#star1" x="85" y="15"/>
  <use href="#star1" x="140" y="35"/>
  <use href="#star1" x="215" y="15"/>
  <use href="#star1" x="330" y="40"/>
  <use href="#star1" x="375" y="25"/>
  <use href="#star1" x="25" y="80"/>
  <use href="#star1" x="360" y="70"/>
  <use href="#star1" x="160" y="70"/>
  <use href="#star1" x="310" y="75"/>
  <use href="#star3" x="50" y="35"/>
  <use href="#star3" x="155" y="15"/>
  <use href="#star3" x="265" y="35"/>
  <use href="#star3" x="345" y="15"/>
  <use href="#star3" x="95" y="80"/>
  <use href="#star3" x="195" y="60"/>
  <use href="#star3" x="380" y="55"/>

  <!-- 静态小星 -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="15" cy="25" r="0.7"/>
    <circle cx="70" cy="55" r="0.5"/>
    <circle cx="125" cy="85" r="0.6"/>
    <circle cx="230" cy="30" r="0.5"/>
    <circle cx="280" cy="65" r="0.7"/>
    <circle cx="355" cy="45" r="0.5"/>
    <circle cx="390" cy="85" r="0.6"/>
  </g>

  <!-- ===== 金色月亮 ===== -->
  <g transform="translate(315, 52)">
    <circle cx="0" cy="0" r="32" fill="url(#moonGlow)" filter="url(#softGlow)">
      <animate attributeName="r" values="28;36;28" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="16" fill="#fff8d0" filter="url(#softGlow)"/>
    <circle cx="-4" cy="-3" r="2.6" fill="#ffd94a" opacity="0.5"/>
    <circle cx="5" cy="4" r="1.6" fill="#ffd94a" opacity="0.4"/>
    <circle cx="-2" cy="6" r="1.3" fill="#ffd94a" opacity="0.35"/>
  </g>

  <!-- ===== 远山（紫色调） ===== -->
  <g opacity="0.5">
    <path d="M0,205 Q40,170 75,190 Q110,165 150,185 Q190,160 230,182 Q270,168 310,185 Q350,172 400,195 L400,280 L0,280 Z" fill="#2a1060"/>
    <path d="M0,220 Q50,195 100,212 Q150,190 200,210 Q260,192 320,212 Q360,200 400,215 L400,280 L0,280 Z" fill="#3a1870"/>
  </g>

  <!-- ===== 树影 ===== -->
  <g opacity="0.35">
    <path d="M50,225 Q53,205 56,190 Q59,205 62,225" fill="#1a0a4a"/>
    <ellipse cx="56" cy="185" rx="22" ry="18" fill="#1a0a4a"/>
    <ellipse cx="40" cy="192" rx="13" ry="10" fill="#1a0a4a"/>
    <ellipse cx="74" cy="190" rx="11" ry="9" fill="#1a0a4a"/>
  </g>
  <g opacity="0.3">
    <path d="M348,228 Q350,212 352,198 Q354,212 356,228" fill="#1a0a4a"/>
    <ellipse cx="352" cy="194" rx="18" ry="15" fill="#1a0a4a"/>
    <ellipse cx="340" cy="200" rx="10" ry="9" fill="#1a0a4a"/>
    <ellipse cx="365" cy="198" rx="9" ry="8" fill="#1a0a4a"/>
  </g>

  <!-- ===== 水面（整片波动） ===== -->
  <path fill="url(#waterGrad)">
    <animate attributeName="d" values="
      M0,228 Q50,212 100,226 Q150,214 200,228 Q250,214 300,226 Q350,212 400,226 L400,280 L0,280 Z;
      M0,224 Q50,230 100,216 Q150,228 200,216 Q250,228 300,218 Q350,228 400,222 L400,280 L0,280 Z;
      M0,228 Q50,214 100,224 Q150,216 200,226 Q250,218 300,226 Q350,216 400,224 L400,280 L0,280 Z;
      M0,224 Q50,220 100,214 Q150,226 200,218 Q250,214 300,226 Q350,220 400,224 L400,280 L0,280 Z;
      M0,228 Q50,212 100,226 Q150,214 200,228 Q250,214 300,226 Q350,212 400,226 L400,280 L0,280 Z"
      dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- ===== 月光倒影 ===== -->
  <ellipse cx="315" cy="242" rx="40" ry="6" fill="url(#reflection)" opacity="0.5">
    <animate attributeName="ry" values="4;10;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="2.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,1;0,0" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="315" cy="252" rx="28" ry="4" fill="url(#reflection)" opacity="0.3">
    <animate attributeName="ry" values="3;7;3" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </ellipse>

  <!-- ===== 流水波浪（大幅摆动） ===== -->
  <g fill="none" stroke-linecap="round">
    <!-- 波浪层1 -->
    <path stroke="#00e8ff" stroke-width="2.5" opacity="0.7">
      <animate attributeName="d" values="
        M0,234 Q40,220 80,234 Q120,248 160,234 Q200,220 240,234 Q280,248 320,234 Q360,220 400,234;
        M0,236 Q40,250 80,236 Q120,222 160,236 Q200,250 240,236 Q280,222 320,236 Q360,250 400,236;
        M0,234 Q40,220 80,234 Q120,248 160,234 Q200,220 240,234 Q280,248 320,234 Q360,220 400,234"
        dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- 波浪层2（相位错开） -->
    <path stroke="#7affff" stroke-width="2" opacity="0.6">
      <animate attributeName="d" values="
        M0,244 Q45,256 90,244 Q135,230 180,244 Q225,258 270,244 Q315,230 360,244 Q380,252 400,244;
        M0,246 Q45,232 90,246 Q135,260 180,246 Q225,232 270,246 Q315,260 360,246 Q380,238 400,246;
        M0,244 Q45,256 90,244 Q135,230 180,244 Q225,258 270,244 Q315,230 360,244 Q380,252 400,244"
        dur="3.5s" repeatCount="indefinite"/>
    </path>

    <!-- 波浪层3 -->
    <path stroke="#00c8ff" stroke-width="2" opacity="0.5">
      <animate attributeName="d" values="
        M0,254 Q30,246 60,256 Q90,266 120,254 Q150,244 180,256 Q210,266 240,254 Q270,244 300,256 Q330,266 360,254 Q380,248 400,256;
        M0,256 Q30,266 60,254 Q90,244 120,256 Q150,266 180,254 Q210,244 240,256 Q270,266 300,254 Q330,244 360,256 Q380,262 400,254;
        M0,254 Q30,246 60,256 Q90,266 120,254 Q150,244 180,256 Q210,266 240,254 Q270,244 300,256 Q330,266 360,254 Q380,248 400,256"
        dur="2.8s" repeatCount="indefinite"/>
    </path>

    <!-- 底部暗浪 -->
    <path stroke="#ff6ae0" stroke-width="2" opacity="0.3">
      <animate attributeName="d" values="
        M0,264 Q60,256 120,266 Q180,274 240,264 Q300,254 360,266 Q380,270 400,264;
        M0,266 Q60,274 120,264 Q180,254 240,266 Q300,276 360,264 Q380,260 400,266;
        M0,264 Q60,256 120,266 Q180,274 240,264 Q300,254 360,266 Q380,270 400,264"
        dur="4.5s" repeatCount="indefinite"/>
    </path>

    <!-- 横向流动线 -->
    <path d="M-30,237 Q25,230 80,239 Q135,248 190,237" stroke="#7affff" stroke-width="1.2" opacity="0.4" stroke-dasharray="6,10">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="d" values="
        M-30,237 Q25,230 80,239 Q135,248 190,237;
        M-30,239 Q25,233 80,241 Q135,246 190,239;
        M-30,237 Q25,230 80,239 Q135,248 190,237"
        dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M200,247 Q265,238 330,249 Q365,256 430,247" stroke="#7affff" stroke-width="1.2" opacity="0.4" stroke-dasharray="5,9">
      <animate attributeName="stroke-dashoffset" values="0;-42" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="d" values="
        M200,247 Q265,238 330,249 Q365,256 430,247;
        M200,249 Q265,242 330,251 Q365,254 430,249;
        M200,247 Q265,238 330,249 Q365,256 430,247"
        dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M-30,258 Q60,250 150,260 Q240,270 330,258" stroke="#00e8ff" stroke-width="1" opacity="0.35" stroke-dasharray="4,8">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" repeatCount="indefinite"/>
    </path>

    <!-- 浪花白沫 -->
    <path d="M80,228 Q92,222 104,228" stroke="#c0f0ff" stroke-width="1.2" opacity="0.45" fill="none">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M160,226 Q172,220 184,226" stroke="#c0f0ff" stroke-width="1.2" opacity="0.45" fill="none">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.8s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M240,228 Q252,222 264,228" stroke="#c0f0ff" stroke-width="1.2" opacity="0.4" fill="none">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M320,226 Q332,220 344,226" stroke="#c0f0ff" stroke-width="1.2" opacity="0.4" fill="none">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="1.7s" repeatCount="indefinite" begin="0.8s"/>
    </path>
  </g>

  <!-- ===== 水纹涟漪 ===== -->
  <g fill="none" stroke="#7affff" stroke-width="0.7" opacity="0.25">
    <ellipse cx="120" cy="252" rx="10" ry="3">
      <animate attributeName="rx" values="3;16;3" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="1;5;1" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="280" cy="260" rx="8" ry="2">
      <animate attributeName="rx" values="2;13;2" dur="4s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="ry" values="1;4;1" dur="4s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="4s" repeatCount="indefinite" begin="2s"/>
    </ellipse>
  </g>

  <!-- ===== 水面闪烁星光 ===== -->
  <g fill="#7affff" opacity="0.5">
    <circle cx="60" cy="246" r="1">
      <animate attributeName="opacity" values="0;0.9;0" dur="1.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="200" cy="256" r="0.9">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="350" cy="250" r="1">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
  </g>

  <!-- ===== 小舟 ===== -->
  <g transform="translate(150, 236)">
    <animateTransform attributeName="transform" type="translate" values="150,236;156,234;150,236" dur="4s" repeatCount="indefinite"/>
    <path d="M-14,0 Q-12,5 0,6 Q12,5 14,0 Z" fill="#3a1a0a" opacity="0.75"/>
    <path d="M-6,-1 Q-4,-7 0,-8 Q4,-7 6,-1 Z" fill="#4a2a1a" opacity="0.65"/>
    <line x1="0" y1="-8" x2="0" y2="-20" stroke="#4a2a1a" stroke-width="0.7" opacity="0.55"/>
    <path d="M0,-18 L9,-13 L0,-10 Z" fill="#ffe86a" opacity="0.4"/>
  </g>

  <!-- ===== 飘落花瓣 ===== -->
  <g>
    <use href="#petal" x="100" y="140">
      <animateTransform attributeName="transform" type="translate" values="100,140;90,190;80,240" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#petal" x="220" y="130">
      <animateTransform attributeName="transform" type="translate" values="220,130;235,180;250,235" dur="8s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0.7;0.35;0" dur="8s" repeatCount="indefinite" begin="3s"/>
    </use>
    <use href="#petal" x="300" y="160">
      <animateTransform attributeName="transform" type="translate" values="300,160;290,200;280,245" dur="7.5s" repeatCount="indefinite" begin="5s"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="7.5s" repeatCount="indefinite" begin="5s"/>
    </use>
  </g>

  <!-- ===== 萤火虫 ===== -->
  <g>
    <use href="#firefly" x="70" y="165">
      <animateTransform attributeName="transform" type="translate" values="70,165;85,150;95,175;75,160;70,165" dur="5s" repeatCount="indefinite"/>
    </use>
    <use href="#firefly" x="250" y="180">
      <animateTransform attributeName="transform" type="translate" values="250,180;240,165;260,150;270,175;250,180" dur="6s" repeatCount="indefinite" begin="2s"/>
    </use>
    <use href="#firefly" x="330" y="150">
      <animateTransform attributeName="transform" type="translate" values="330,150;345,140;335,160;325,150;330,150" dur="4.5s" repeatCount="indefinite" begin="4s"/>
    </use>
    <use href="#firefly" x="40" y="195">
      <animateTransform attributeName="transform" type="translate" values="40,195;50,185;60,200;45,190;40,195" dur="5.5s" repeatCount="indefinite" begin="1s"/>
    </use>
  </g>

  <!-- ===== 岸边草丛 ===== -->
  <g fill="#1aff8a" opacity="0.35">
    <path d="M0,228 L5,212 L9,228 Z"/>
    <path d="M10,228 L16,206 L20,228 Z"/>
    <path d="M22,228 L26,214 L31,228 Z"/>
  </g>
  <g fill="#1aff8a" opacity="0.3">
    <path d="M360,228 L366,212 L370,228 Z"/>
    <path d="M372,228 L378,208 L383,228 Z"/>
    <path d="M385,228 L389,214 L394,228 Z"/>
  </g>

  <!-- ===== 流星 ===== -->
  <g opacity="0">
    <line x1="50" y1="20" x2="110" y2="80" stroke="url(#flowGrad)" stroke-width="1.2">
      <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" begin="5s" repeatCount="indefinite"/>
    </line>
  </g>
  <g opacity="0">
    <line x1="200" y1="10" x2="245" y2="55" stroke="url(#flowGrad)" stroke-width="0.9">
      <animate attributeName="opacity" values="0;0.7;0" dur="2s" begin="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== 诗句 ===== -->
  <g font-family="'SimSun', 'Noto Serif CJK SC', 'Microsoft YaHei', serif" text-anchor="middle" opacity="0.55">
    <text x="70" y="268" font-size="10" fill="#ffe86a" letter-spacing="2">星 垂 平 野 阔</text>
    <text x="70" y="277" font-size="8.5" fill="#ffb42a" letter-spacing="1.5">月 涌 大 江 流</text>
  </g>
</svg>
