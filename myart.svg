<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 夜空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="40%" stop-color="#141846"/>
      <stop offset="70%" stop-color="#1a2a5a"/>
      <stop offset="100%" stop-color="#2a3a6a"/>
    </linearGradient>

    <!-- 水面渐变 -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a7a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0e3a6a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#062a50" stop-opacity="1"/>
    </linearGradient>

    <!-- 月亮光晕 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde8" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffeebb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffeebb" stop-opacity="0"/>
    </radialGradient>

    <!-- 水面光反射 -->
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffeebb" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffeebb" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#fffde8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ffeebb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffeebb" stop-opacity="0"/>
    </linearGradient>

    <!-- 流水渐变 -->
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ac0ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4ac0ff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7ad8ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#4ac0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4ac0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- 星芒滤镜 -->
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 发光滤镜 -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 月亮滤镜 -->
    <filter id="moonFilter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 星空闪烁动画 -->
    <g id="star1">
      <circle cx="0" cy="0" r="1.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g id="star2">
      <circle cx="0" cy="0" r="2" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g id="star3">
      <circle cx="0" cy="0" r="1" fill="#ffffff" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 萤火虫 -->
    <g id="firefly">
      <circle cx="0" cy="0" r="2" fill="#aaffaa" filter="url(#starGlow)">
        <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="1;3;1" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 飘落花瓣 -->
    <g id="petal">
      <ellipse cx="0" cy="0" rx="4" ry="2.5" fill="#ffb7c5" opacity="0.7" transform="rotate(-15)"/>
    </g>
  </defs>

  <!-- ===== 夜空背景 ===== -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- ===== 极光效果 ===== -->
  <g opacity="0.15">
    <path d="M0,80 Q100,40 200,90 Q300,130 400,70 Q500,20 600,80 Q700,130 800,60 L800,0 L0,0 Z" fill="#7af0ff">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;20,-10;0,0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0,120 Q150,60 300,130 Q450,180 600,100 Q700,50 800,110 L800,0 L0,0 Z" fill="#a080ff">
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-15,-8;0,0" dur="15s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== 星空 ===== -->
  <!-- 大星（带星芒） -->
  <g filter="url(#starGlow)">
    <use href="#star2" x="120" y="45"/>
    <use href="#star2" x="350" y="80"/>
    <use href="#star2" x="580" y="35"/>
    <use href="#star2" x="680" y="95"/>
    <use href="#star2" x="200" y="120"/>
    <use href="#star2" x="500" y="55"/>
  </g>

  <!-- 中星 -->
  <use href="#star1" x="60" y="90"/>
  <use href="#star1" x="160" y="30"/>
  <use href="#star1" x="250" y="65"/>
  <use href="#star1" x="420" y="25"/>
  <use href="#star1" x="480" y="90"/>
  <use href="#star1" x="620" y="60"/>
  <use href="#star1" x="750" y="40"/>
  <use href="#star1" x="55" y="160"/>
  <use href="#star1" x="720" y="150"/>
  <use href="#star1" x="320" y="140"/>
  <use href="#star1" x="600" y="130"/>

  <!-- 小星（发光闪烁） -->
  <use href="#star3" x="90" y="65"/>
  <use href="#star3" x="300" y="35"/>
  <use href="#star3" x="530" y="70"/>
  <use href="#star3" x="450" y="45"/>
  <use href="#star3" x="700" y="20"/>
  <use href="#star3" x="180" y="95"/>
  <use href="#star3" x="380" y="110"/>
  <use href="#star3" x="650" y="100"/>
  <use href="#star3" x="770" y="75"/>

  <!-- 散布的小星点（静态） -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="30" cy="50" r="0.8"/>
    <circle cx="140" cy="110" r="0.6"/>
    <circle cx="230" cy="20" r="0.7"/>
    <circle cx="280" cy="100" r="0.5"/>
    <circle cx="360" cy="60" r="0.8"/>
    <circle cx="410" cy="120" r="0.6"/>
    <circle cx="490" cy="30" r="0.7"/>
    <circle cx="550" cy="110" r="0.5"/>
    <circle cx="640" cy="25" r="0.8"/>
    <circle cx="670" cy="140" r="0.6"/>
    <circle cx="760" cy="110" r="0.7"/>
    <circle cx="100" cy="180" r="0.5"/>
    <circle cx="780" cy="130" r="0.6"/>
    <circle cx="45" cy="130" r="0.5"/>
  </g>

  <!-- ===== 月亮 ===== -->
  <g transform="translate(620, 100)">
    <!-- 月光晕 -->
    <circle cx="0" cy="0" r="60" fill="url(#moonGlow)" filter="url(#moonFilter)">
      <animate attributeName="r" values="55;65;55" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- 月轮 -->
    <circle cx="0" cy="0" r="30" fill="#fffde8" filter="url(#softGlow)"/>
    <!-- 月面纹理 -->
    <circle cx="-8" cy="-5" r="5" fill="#f0e8c0" opacity="0.4"/>
    <circle cx="10" cy="8" r="3" fill="#f0e8c0" opacity="0.3"/>
    <circle cx="-5" cy="12" r="2.5" fill="#f0e8c0" opacity="0.25"/>
  </g>

  <!-- ===== 远山 ===== -->
  <g opacity="0.35">
    <path d="M0,420 Q80,350 150,390 Q220,340 300,380 Q380,330 450,370 Q520,340 600,380 Q680,350 800,400 L800,600 L0,600 Z" fill="#0e1a3a"/>
    <path d="M0,450 Q100,390 200,420 Q280,370 360,410 Q440,380 540,420 Q640,390 800,440 L800,600 L0,600 Z" fill="#121e42"/>
  </g>

  <!-- ===== 月下树影（左侧） ===== -->
  <g opacity="0.3">
    <!-- 大树干 -->
    <path d="M100,460 Q105,420 110,390 Q115,420 120,460" fill="#1a2a3a"/>
    <!-- 树冠 -->
    <ellipse cx="110" cy="380" rx="40" ry="35" fill="#0e1a32"/>
    <ellipse cx="90" cy="390" rx="25" ry="20" fill="#0e1a32"/>
    <ellipse cx="135" cy="390" rx="20" ry="18" fill="#0e1a32"/>
  </g>

  <!-- ===== 右侧树影 ===== -->
  <g opacity="0.25">
    <path d="M700,470 Q705,440 710,410 Q715,440 720,470" fill="#1a2a3a"/>
    <ellipse cx="710" cy="400" rx="35" ry="30" fill="#0e1a32"/>
    <ellipse cx="690" cy="410" rx="20" ry="18" fill="#0e1a32"/>
    <ellipse cx="735" cy="408" rx="18" ry="16" fill="#0e1a32"/>
  </g>

  <!-- ===== 水面 ===== -->
  <path d="M0,460 Q200,440 400,455 Q600,470 800,450 L800,600 L0,600 Z" fill="url(#waterGrad)"/>

  <!-- ===== 水面月光倒影 ===== -->
  <ellipse cx="620" cy="500" rx="80" ry="15" fill="url(#reflection)" opacity="0.5">
    <animate attributeName="rx" values="70;85;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="620" cy="520" rx="50" ry="8" fill="url(#reflection)" opacity="0.3">
    <animate attributeName="rx" values="45;55;45" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== 流水效果（多层动画河流线条） ===== -->
  <!-- 流水层1：主水流 -->
  <g fill="none" stroke-linecap="round">
    <path d="M0,475 Q100,465 200,478 Q300,490 400,480 Q500,470 600,485 Q700,498 800,485" stroke="url(#flowGrad)" stroke-width="3" opacity="0.6">
      <animate attributeName="d" values="
        M0,475 Q100,465 200,478 Q300,490 400,480 Q500,470 600,485 Q700,498 800,485;
        M0,478 Q100,470 200,480 Q300,488 400,483 Q500,475 600,488 Q700,495 800,488;
        M0,475 Q100,465 200,478 Q300,490 400,480 Q500,470 600,485 Q700,498 800,485"
        dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- 流水层2 -->
    <path d="M0,495 Q120,485 240,498 Q360,510 480,498 Q600,486 720,500 Q760,506 800,500" stroke="url(#flowGrad)" stroke-width="2.5" opacity="0.5">
      <animate attributeName="d" values="
        M0,495 Q120,485 240,498 Q360,510 480,498 Q600,486 720,500 Q760,506 800,500;
        M0,498 Q120,490 240,500 Q360,506 480,502 Q600,492 720,504 Q760,508 800,504;
        M0,495 Q120,485 240,498 Q360,510 480,498 Q600,486 720,500 Q760,506 800,500"
        dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- 流水层3 -->
    <path d="M0,515 Q150,505 300,518 Q450,530 600,518 Q700,508 800,515" stroke="url(#flowGrad)" stroke-width="2" opacity="0.4">
      <animate attributeName="d" values="
        M0,515 Q150,505 300,518 Q450,530 600,518 Q700,508 800,515;
        M0,518 Q150,510 300,520 Q450,526 600,522 Q700,514 800,518;
        M0,515 Q150,505 300,518 Q450,530 600,518 Q700,508 800,515"
        dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- 流水层4：底部暗流 -->
    <path d="M0,540 Q100,533 200,542 Q300,550 400,542 Q500,535 600,545 Q700,555 800,545" stroke="#3a8acc" stroke-width="3" opacity="0.25">
      <animate attributeName="d" values="
        M0,540 Q100,533 200,542 Q300,550 400,542 Q500,535 600,545 Q700,555 800,545;
        M0,543 Q100,537 200,545 Q300,548 400,546 Q500,540 600,548 Q700,552 800,548;
        M0,540 Q100,533 200,542 Q300,550 400,542 Q500,535 600,545 Q700,555 800,545"
        dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- 流水高光闪烁 -->
    <path d="M100,478 Q200,470 300,482" stroke="#7ad8ff" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M450,480 Q550,470 650,485" stroke="#7ad8ff" stroke-width="1.5" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- ===== 水纹涟漪 ===== -->
  <g fill="none" stroke="#7ad8ff" stroke-width="0.8" opacity="0.2">
    <ellipse cx="300" cy="510" rx="15" ry="4">
      <animate attributeName="rx" values="5;25;5" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="1;6;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="550" cy="530" rx="12" ry="3">
      <animate attributeName="rx" values="4;20;4" dur="5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="ry" values="1;5;1" dur="5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite" begin="2s"/>
    </ellipse>
  </g>

  <!-- ===== 水面闪烁星光 ===== -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="150" cy="490" r="1.5">
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="350" cy="505" r="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="500" cy="495" r="1.5">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="680" cy="510" r="1">
      <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- ===== 小舟 ===== -->
  <g transform="translate(300, 478)">
    <animateTransform attributeName="transform" type="translate" values="300,478;310,476;300,478" dur="5s" repeatCount="indefinite"/>
    <!-- 船身 -->
    <path d="M-20,0 Q-18,6 0,8 Q18,6 20,0 Z" fill="#2a1a0a" opacity="0.7"/>
    <!-- 船篷 -->
    <path d="M-8,-2 Q-6,-10 0,-12 Q6,-10 8,-2 Z" fill="#3a2a1a" opacity="0.6"/>
    <!-- 桅杆 -->
    <line x1="0" y1="-12" x2="0" y2="-28" stroke="#3a2a1a" stroke-width="0.8" opacity="0.5"/>
    <!-- 帆 -->
    <path d="M0,-26 L12,-18 L0,-14 Z" fill="#c8b898" opacity="0.3"/>
  </g>

  <!-- ===== 飘落的花瓣 ===== -->
  <g>
    <use href="#petal" x="200" y="300">
      <animateTransform attributeName="transform" type="translate" values="200,300;180,420;160,500" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.4;0" dur="8s" repeatCount="indefinite"/>
    </use>
    <use href="#petal" x="450" y="280">
      <animateTransform attributeName="transform" type="translate" values="450,280;470,400;490,520" dur="10s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="10s" repeatCount="indefinite" begin="3s"/>
    </use>
    <use href="#petal" x="350" y="350">
      <animateTransform attributeName="transform" type="translate" values="350,350;330,440;310,530" dur="9s" repeatCount="indefinite" begin="5s"/>
      <animate attributeName="opacity" values="0.5;0.3;0" dur="9s" repeatCount="indefinite" begin="5s"/>
    </use>
  </g>

  <!-- ===== 萤火虫 ===== -->
  <g>
    <use href="#firefly" x="150" y="350">
      <animateTransform attributeName="transform" type="translate" values="150,350;180,330;200,360;170,340;150,350" dur="6s" repeatCount="indefinite"/>
    </use>
    <use href="#firefly" x="500" y="380">
      <animateTransform attributeName="transform" type="translate" values="500,380;480,360;510,340;530,370;500,380" dur="7s" repeatCount="indefinite" begin="2s"/>
    </use>
    <use href="#firefly" x="650" y="320">
      <animateTransform attributeName="transform" type="translate" values="650,320;670,300;660,340;640,320;650,320" dur="5s" repeatCount="indefinite" begin="4s"/>
    </use>
    <use href="#firefly" x="80" y="400">
      <animateTransform attributeName="transform" type="translate" values="80,400;100,380;120,410;95,395;80,400" dur="8s" repeatCount="indefinite" begin="1s"/>
    </use>
  </g>

  <!-- ===== 岸边草丛（左） ===== -->
  <g fill="#1a3a2a" opacity="0.5">
    <path d="M0,460 L8,430 L12,460 Z"/>
    <path d="M15,460 L25,425 L30,460 Z"/>
    <path d="M35,460 L40,435 L48,460 Z"/>
    <path d="M50,460 L60,440 L65,460 Z"/>
    <path d="M65,460 L70,432 L78,460 Z"/>
  </g>

  <!-- ===== 岸边草丛（右） ===== -->
  <g fill="#1a3a2a" opacity="0.45">
    <path d="M720,460 L728,438 L732,460 Z"/>
    <path d="M735,460 L742,425 L748,460 Z"/>
    <path d="M750,460 L758,435 L765,460 Z"/>
    <path d="M768,460 L775,440 L780,460 Z"/>
  </g>

  <!-- ===== 左下角诗句 ===== -->
  <g font-family="'SimSun', 'Noto Serif CJK SC', 'Microsoft YaHei', serif" text-anchor="middle" opacity="0.45">
    <text x="160" y="575" font-size="14" fill="#aac8ff" letter-spacing="3">星 垂 平 野 阔</text>
    <text x="160" y="592" font-size="12" fill="#8ab0e0" letter-spacing="2">月 涌 大 江 流</text>
  </g>

  <!-- ===== 右上角印章 ===== -->
  <g transform="translate(730, 530)" opacity="0.3">
    <rect x="-25" y="-25" width="50" height="50" rx="3" fill="none" stroke="#cc4444" stroke-width="1.5"/>
    <text x="0" y="-2" font-family="'SimSun', serif" font-size="16" fill="#cc4444" text-anchor="middle">夜</text>
    <text x="0" y="15" font-family="'SimSun', serif" font-size="16" fill="#cc4444" text-anchor="middle">泊</text>
  </g>

  <!-- ===== 流星 ===== -->
  <g opacity="0">
    <line x1="100" y1="50" x2="200" y2="150" stroke="url(#flowGrad)" stroke-width="1.5">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="5s" repeatCount="indefinite"/>
    </line>
  </g>
  <g opacity="0">
    <line x1="400" y1="30" x2="480" y2="110" stroke="url(#flowGrad)" stroke-width="1">
      <animate attributeName="opacity" values="0;0.6;0" dur="2.5s" begin="10s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
